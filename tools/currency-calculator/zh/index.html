<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRO Consulting 货币计算器</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #03050a;
      --nav: rgba(3, 5, 10, 0.86);
      --panel: rgba(8, 13, 24, 0.82);
      --panel-strong: rgba(10, 16, 29, 0.96);
      --field: rgba(0, 0, 0, 0.26);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(59, 130, 246, 0.34);
      --text: #f8fafc;
      --soft: #d7dce7;
      --muted: #9ca3af;
      --muted-2: #687386;
      --blue-deep: #1b3671;
      --blue: #3b82f6;
      --blue-hover: #2563eb;
      --teal: #14b8a6;
      --violet: #8b5cf6;
      --warning: #f59e0b;
      --shadow: 0 26px 80px rgba(0, 0, 0, 0.54);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body.light-theme {
      --bg: #f4f8ff;
      --nav: rgba(248, 251, 255, 0.82);
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --field: rgba(255, 255, 255, 0.78);
      --border: rgba(27, 54, 113, 0.12);
      --border-strong: rgba(37, 99, 235, 0.22);
      --text: #0b1220;
      --soft: #172033;
      --muted: #40506b;
      --muted-2: #687792;
      --shadow: 0 24px 78px rgba(27, 54, 113, 0.14);
      color-scheme: light;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -4;
      background:
        radial-gradient(circle at 13% 35%, rgba(27, 54, 113, 0.78), transparent 28rem),
        radial-gradient(circle at 78% 18%, rgba(139, 92, 246, 0.12), transparent 24rem),
        linear-gradient(90deg, rgba(27, 54, 113, 0.42), transparent 36%, rgba(3, 5, 10, 0.96));
    }

    body.light-theme::before {
      background:
        radial-gradient(circle at 14% 8%, rgba(59, 130, 246, 0.22), transparent 28rem),
        radial-gradient(circle at 86% 28%, rgba(124, 58, 237, 0.12), transparent 26rem),
        linear-gradient(135deg, #eef5ff 0%, #f8fbff 48%, #e9f1ff 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(90deg, #000, rgba(0, 0, 0, 0.66), transparent 82%);
    }

    body.light-theme::after {
      background-image:
        linear-gradient(rgba(27, 54, 113, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(27, 54, 113, 0.055) 1px, transparent 1px);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .page {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .gro-ribbon {
      position: fixed;
      left: 50%;
      top: 12vh;
      width: 170vw;
      height: 62vh;
      min-height: 420px;
      transform: translate3d(calc(-50% + var(--ribbon-x, 0px)), var(--ribbon-y, 0px), 0);
      color: #2f6bff;
      opacity: 0.98;
      pointer-events: none;
      z-index: -1;
      filter: saturate(1.38) brightness(1.12);
    }

    body.light-theme .gro-ribbon {
      color: #2563eb;
      opacity: 0.82;
      mix-blend-mode: multiply;
    }

    .ribbon-core {
      animation: ribbonFlow 4.4s ease-in-out infinite alternate;
      transform-origin: center;
    }

    .ribbon-glow {
      animation: ribbonFlowReverse 5.6s ease-in-out infinite alternate;
      transform-origin: center;
    }

    .ribbon-line {
      animation: ribbonLine 3.8s ease-in-out infinite alternate;
      transform-origin: center;
    }

    @keyframes ribbonFlow {
      from { transform: translateX(-96px) translateY(28px) scaleX(1.04); }
      to { transform: translateX(118px) translateY(-36px) scaleX(1.1); }
    }

    @keyframes ribbonFlowReverse {
      from { transform: translateX(108px) translateY(-32px) scaleX(1.08); }
      to { transform: translateX(-100px) translateY(42px) scaleX(1.03); }
    }

    @keyframes ribbonLine {
      from { transform: translateX(-70px) translateY(16px); }
      to { transform: translateX(86px) translateY(-24px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ribbon-core,
      .ribbon-glow,
      .ribbon-line { animation: none; }
    }

    .page::before {
      content: "";
      position: fixed;
      left: 38%;
      top: 112px;
      width: 64vw;
      height: 440px;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(110deg, transparent 0 12%, rgba(59, 130, 246, 0.08) 24%, transparent 42%),
        linear-gradient(128deg, transparent 0 22%, rgba(139, 92, 246, 0.10) 38%, transparent 58%),
        linear-gradient(145deg, transparent 0 34%, rgba(20, 184, 166, 0.06) 46%, transparent 68%);
      transform: rotate(-8deg);
      filter: blur(2px);
      opacity: 0.9;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: var(--nav);
      backdrop-filter: blur(18px);
    }

    .nav-inner {
      width: min(1210px, calc(100% - 48px));
      height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .logo {
      display: inline-flex;
      align-items: baseline;
      text-decoration: none;
      font-size: 21px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      white-space: nowrap;
    }

    .logo span {
      color: var(--blue);
    }

    .nav-links,
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 24px;
      color: #8f98a8;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links a,
    .nav-actions a,
    .nav-phone,
    .lang {
      color: inherit;
      text-decoration: none;
    }

    .nav-phone {
      color: #f4f7fb;
      font-weight: 800;
      white-space: nowrap;
    }

    .lang {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.035);
      white-space: nowrap;
    }

    body.light-theme .nav,
    body.light-theme .lang,
    body.light-theme .theme-toggle,
    body.light-theme .tool,
    body.light-theme .quick-rate,
    body.light-theme .source-note {
      border-color: rgba(27, 54, 113, 0.12);
    }

    body.light-theme .nav {
      box-shadow: 0 12px 38px rgba(27, 54, 113, 0.08);
    }

    .theme-toggle {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
      color: inherit;
      cursor: pointer;
    }

    .theme-toggle .sun-icon { display: none; }
    .theme-toggle .moon-icon { display: block; }
    body.light-theme .theme-toggle .sun-icon { display: block; }
    body.light-theme .theme-toggle .moon-icon { display: none; }

    body.light-theme h1,
    body.light-theme h2,
    body.light-theme h3,
    body.light-theme .logo,
    body.light-theme .nav-phone,
    body.light-theme .quick-rate b,
    body.light-theme .result-value,
    body.light-theme .rate-value {
      color: #0b1220;
    }

    body.light-theme .lead,
    body.light-theme .subtle,
    body.light-theme .quick-rate span,
    body.light-theme .source-note,
    body.light-theme .result-note,
    body.light-theme .status {
      color: #40506b;
    }

    body.light-theme input,
    body.light-theme select {
      color: #0b1220;
      background: rgba(255, 255, 255, 0.82);
      border-color: rgba(27, 54, 113, 0.16);
    }

    body.light-theme input:focus,
    body.light-theme select:focus {
      background: #fff;
      border-color: rgba(59, 130, 246, 0.54);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14), 0 18px 34px rgba(27, 54, 113, 0.08);
    }

    body.light-theme select option {
      background: #fff;
      color: #0b1220;
    }

    body.light-theme .tool {
      background:
        radial-gradient(circle at 18% 0%, rgba(59, 130, 246, 0.15), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(246, 249, 255, 0.86));
      box-shadow: 0 28px 70px rgba(27, 54, 113, 0.14), 0 0 50px rgba(59, 130, 246, 0.1);
    }

    body.light-theme .tool::before {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.36), transparent 35%, rgba(139, 92, 246, 0.14) 58%, rgba(20, 184, 166, 0.12));
    }

    body.light-theme .tool-head {
      background: rgba(255, 255, 255, 0.4);
      border-bottom-color: rgba(27, 54, 113, 0.1);
    }

    body.light-theme label {
      color: #4b5d78;
    }

    body.light-theme .help {
      color: #1d4ed8;
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.22);
    }

    body.light-theme .help::after {
      color: #10203c;
      background: #fff;
      border-color: rgba(27, 54, 113, 0.12);
      box-shadow: 0 18px 36px rgba(27, 54, 113, 0.16);
    }

    body.light-theme .chip {
      color: #34445f;
      background: rgba(255, 255, 255, 0.62);
      border-color: rgba(27, 54, 113, 0.12);
    }

    body.light-theme .chip:has(input:checked) {
      color: #0f3c93;
      background: rgba(59, 130, 246, 0.13);
      border-color: rgba(59, 130, 246, 0.44);
      box-shadow: 0 12px 26px rgba(59, 130, 246, 0.12);
    }

    body.light-theme .rate {
      background: rgba(255, 255, 255, 0.62);
      border-color: rgba(27, 54, 113, 0.12);
    }

    body.light-theme .code {
      color: #1e3a8a;
    }

    body.light-theme .name,
    body.light-theme .note {
      color: #52627a;
    }

    body.light-theme .value {
      color: #0b1220;
    }

    body.light-theme .converter {
      background: linear-gradient(135deg, rgba(219, 234, 254, 0.68), rgba(255, 255, 255, 0.72));
      border-color: rgba(59, 130, 246, 0.18);
    }

    body.light-theme .swap {
      color: #1d4ed8;
      background: rgba(255, 255, 255, 0.68);
      border-color: rgba(27, 54, 113, 0.14);
    }

    body.light-theme .swap:hover {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.38);
    }

    body.light-theme .result {
      background: rgba(20, 184, 166, 0.1);
      border-color: rgba(20, 184, 166, 0.24);
    }

    body.light-theme .result-label {
      color: #047857;
    }

    .wrap {
      width: calc(100% - 48px);
      max-width: 1210px;
      margin: 0 auto;
      padding: 74px 0 56px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 0.46fr) minmax(0, 1fr);
      gap: 40px;
      align-items: start;
      max-width: 100%;
    }

    .layout > *,
    .tool,
    .tool-body,
    .control-line,
    .chips,
    .rates,
    .converter,
    .converter-grid {
      min-width: 0;
      max-width: 100%;
    }

    .intro {
      padding: 18px 0 28px;
    }

    body.light-theme .intro {
      color: #0b1220;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.9);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      max-width: 590px;
      color: #f4f7fb;
      font-size: clamp(44px, 6vw, 72px);
      line-height: 1.02;
      letter-spacing: -0.035em;
      font-weight: 800;
    }

    .lead {
      max-width: 560px;
      margin: 24px 0 0;
      color: #a0a8b7;
      font-size: 18px;
      line-height: 1.58;
    }

    .trust-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      color: #c4d7ff;
      font-size: 14px;
      font-weight: 700;
    }

    .quick-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .quick-rate {
      min-width: 112px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
    }

    .quick-rate b {
      display: block;
      color: #fff;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .quick-rate span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .tool {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 24px;
      background:
        radial-gradient(circle at 16% 0%, rgba(59, 130, 246, 0.14), transparent 30%),
        linear-gradient(180deg, rgba(11, 17, 30, 0.94), rgba(7, 12, 22, 0.9));
      box-shadow: var(--shadow), 0 0 60px rgba(27, 54, 113, 0.32), 0 0 90px rgba(139, 92, 246, 0.07);
      backdrop-filter: blur(18px);
      overflow: hidden;
      isolation: isolate;
    }

    .tool::before {
      content: "";
      position: absolute;
      inset: -1px;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.55), transparent 33%, rgba(139, 92, 246, 0.2) 58%, rgba(20, 184, 166, 0.18));
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .tool-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      padding: 26px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.018);
    }

    h2 {
      margin: 0 0 6px;
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .subtle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status {
      min-width: 178px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.45;
      text-align: right;
    }

    .tool-body {
      padding: 24px;
    }

    .control-line {
      display: grid;
      grid-template-columns: minmax(170px, 220px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
      margin-bottom: 20px;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .help {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      color: #bfdbfe;
      background: rgba(255, 255, 255, 0.045);
      font-size: 11px;
      font-weight: 800;
      cursor: help;
      text-transform: none;
      letter-spacing: 0;
    }

    .help::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      width: min(260px, 70vw);
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: #0b1220;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.36);
      color: #dbe4f0;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 20;
    }

    .help:hover::after,
    .help:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 12px;
      background: var(--field);
      color: #fff;
      padding: 0 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16), 0 0 20px rgba(59, 130, 246, 0.16);
      background: rgba(0, 0, 0, 0.42);
    }

    select option {
      background: #0a0f1a;
      color: #fff;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(66px, 1fr));
      gap: 9px;
    }

    .chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      min-width: 0;
      width: 100%;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: #d1d5db;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 800;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .chip:has(input:checked) {
      border-color: rgba(59, 130, 246, 0.66);
      background: rgba(59, 130, 246, 0.17);
      color: #fff;
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.18);
    }

    .rates {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .rate {
      min-height: 142px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.026));
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .rate-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 18px;
    }

    .code {
      color: #dbeafe;
      font-size: 15px;
      font-weight: 800;
    }

    .name {
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .value {
      margin-bottom: 8px;
      color: #fff;
      font-size: 25px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .converter {
      padding: 18px;
      border: 1px solid rgba(59, 130, 246, 0.17);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(27, 54, 113, 0.26), rgba(139, 92, 246, 0.08) 48%, rgba(255, 255, 255, 0.025));
    }

    .converter-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .converter-title h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .converter-grid {
      display: grid;
      grid-template-columns: minmax(150px, 1.1fr) minmax(130px, 0.85fr) minmax(130px, 0.85fr) 48px;
      gap: 10px;
      align-items: end;
    }

    .swap {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.055);
      color: #dbeafe;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .swap:hover {
      transform: translateY(-1px);
      border-color: rgba(59, 130, 246, 0.54);
      background: rgba(59, 130, 246, 0.13);
    }

    .result {
      margin-top: 14px;
      padding: 17px 18px;
      border: 1px solid rgba(20, 184, 166, 0.27);
      border-radius: 15px;
      background: rgba(20, 184, 166, 0.08);
    }

    .result-label {
      margin-bottom: 5px;
      color: #a7f3d0;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .result-value {
      overflow-wrap: anywhere;
      color: #fff;
      font-size: clamp(32px, 4.2vw, 46px);
      line-height: 1.06;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .result-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #9fb0c8;
      font-size: 12px;
      line-height: 1.45;
    }

    .message.show {
      display: block;
    }

    .source-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      color: #748197;
      font-size: 12px;
      line-height: 1.45;
    }

    .source-note span:last-child {
      color: #94a3b8;
    }

    .loading .rates,
    .loading .converter {
      opacity: 0.55;
    }

    @media (max-width: 1080px) {
      .nav-links {
        display: none;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .intro {
        max-width: 760px;
        padding-bottom: 4px;
      }
    }

    @media (max-width: 760px) {
      .nav-inner,
      .wrap {
        width: calc(100vw - 24px);
        max-width: calc(100vw - 24px);
      }

      .layout,
      .intro,
      .tool,
      .lead {
        width: 100%;
        max-width: 100%;
      }

      .nav-actions {
        gap: 8px;
      }

      .logo {
        font-size: 19px;
      }

      .lang {
        padding: 0 10px;
      }

      .nav-phone {
        display: none;
      }

      .wrap {
        padding-top: 42px;
      }

      .tool-head,
      .control-line,
      .converter-grid {
        grid-template-columns: 1fr;
      }

      .tool-head {
        flex-direction: column;
      }

      .status {
        min-width: 0;
        text-align: left;
      }


      .swap {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .chips {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      h1 {
        font-size: 42px;
      }

      .tool-head,
      .tool-body {
        padding: 18px;
      }

      .source-note {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <svg class="gro-ribbon" viewBox="0 0 1600 520" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="ribbonGradientMainCurrency" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="currentColor" stop-opacity="0.03"/>
          <stop offset="0.36" stop-color="currentColor" stop-opacity="0.34"/>
          <stop offset="0.62" stop-color="currentColor" stop-opacity="0.82"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0.08"/>
        </linearGradient>
        <linearGradient id="ribbonGradientSoftCurrency" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="currentColor" stop-opacity="0.02"/>
          <stop offset="0.55" stop-color="currentColor" stop-opacity="0.24"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0.06"/>
        </linearGradient>
        <filter id="ribbonBlurCurrency" x="-20%" y="-90%" width="140%" height="280%">
          <feGaussianBlur stdDeviation="11" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path class="ribbon-glow" d="M-80 288 C 244 88, 523 484, 900 292 C 1144 168, 1326 82, 1700 26 L1700 136 C 1308 190, 1088 360, 742 430 C 472 486, 224 304, -80 378 Z" fill="url(#ribbonGradientSoftCurrency)"/>
      <path class="ribbon-core" d="M-90 258 C 214 336, 392 474, 754 424 C 1055 383, 1194 240, 1700 94 L1700 176 C 1312 312, 1054 496, 674 478 C 348 462, 122 330, -90 302 Z" fill="url(#ribbonGradientMainCurrency)" filter="url(#ribbonBlurCurrency)"/>
      <path class="ribbon-line" d="M-90 320 C 250 244, 438 386, 760 372 C 1072 360, 1262 224, 1700 138" fill="none" stroke="currentColor" stroke-opacity="0.72" stroke-width="6" filter="url(#ribbonBlurCurrency)"/>
    </svg>
    <header class="nav">
      <div class="nav-inner">
          <a class="logo" href="https://gro-consult.ru/zh/" data-local-href="http://127.0.0.1:4300/zh/" aria-label="GRO Consulting">GRO<span>CONSULTING</span></a>
        <div class="nav-actions">
          <a class="nav-phone" href="tel:+74955653797">8 (495) 565-37-97</a>
          <a class="lang" href="/">RU / 中文</a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题">
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 14.2A7.6 7.6 0 0 1 9.8 3a8.8 8.8 0 1 0 11.2 11.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="layout">
        <section class="intro" aria-labelledby="page-title">
          <h1 id="page-title">货币计算器</h1>
          <p class="lead">按俄罗斯央行汇率快速换算常用货币。请选择日期、金额和兑换方向。</p>
          <div class="trust-line"><span class="dot"></span> 数据基于俄罗斯央行官方汇率</div>
          <div class="quick-row" id="quick-row" aria-label="简要汇率"></div>
        </section>

        <section class="tool" id="app" aria-label="货币计算器">
          <div class="tool-head">
            <div>
              <h2>汇率与换算</h2>
              <div class="subtle">
                <span>所选日期的官方汇率</span>
                <span class="help" tabindex="0" data-tip="如果所选日期没有公布汇率，将使用最近一个已公布的工作日汇率。">?</span>
              </div>
            </div>
            <div class="status" id="status">正在加载汇率...</div>
          </div>

          <div class="tool-body">
            <div class="control-line">
              <div>
                <label for="date-input">计算日期 <span class="help" tabindex="0" data-tip="用于计算的官方汇率日期。">?</span></label>
                <input id="date-input" type="date">
              </div>
              <div>
                <label>显示货币 <span class="help" tabindex="0" data-tip="请选择要显示在汇率面板中的货币。卢布在换算器中始终可用。">?</span></label>
                <div class="chips" id="currency-chips"></div>
              </div>
            </div>

            <div class="rates" id="rates-grid"></div>

            <div class="converter">
              <div class="converter-title">
                <h3>换算器</h3>
                <span class="help" tabindex="0" data-tip="交叉汇率通过卢布计算：先换算为卢布，再换算为目标货币。">?</span>
              </div>

              <div class="converter-grid">
                <div>
                  <label for="amount">金额</label>
                  <input id="amount" type="number" min="0" step="0.01" value="1000">
                </div>
                <div>
                  <label for="from-currency">从</label>
                  <select id="from-currency"></select>
                </div>
                <div>
                  <label for="to-currency">到</label>
                  <select id="to-currency"></select>
                </div>
                <button class="swap" type="button" id="swap" title="交换货币" aria-label="交换货币">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>

              <div class="result">
                <div class="result-label">结果</div>
                <div class="result-value" id="result-value">...</div>
                <div class="result-note" id="result-note">等待汇率数据</div>
              </div>
            </div>

            <div class="message" id="message"></div>
            <div class="source-note">
              <span>汇率仅供参考，可用于初步估算。</span>
              <span>数据来源：俄罗斯央行</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const key = "gro-theme-v2";
      const applyTheme = (theme) => {
        document.body.classList.toggle("light-theme", theme === "light");
        document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
          button.setAttribute("aria-label", theme === "light" ? "切换到夜间主题" : "切换到日间主题");
        });
      };
      const getInitialTheme = () => {
        const requested = new URLSearchParams(window.location.search).get("theme");
        if (requested === "light" || requested === "dark") {
          try { localStorage.setItem(key, requested); } catch (error) {}
          return requested;
        }
        try { return localStorage.getItem(key) || "dark"; } catch (error) { return "dark"; }
      };
      applyTheme(getInitialTheme());
      window.addEventListener("DOMContentLoaded", () => {
        if (window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost") {
          document.querySelectorAll("[data-local-href]").forEach((link) => {
            link.href = link.dataset.localHref;
          });
        }
        document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
          button.addEventListener("click", () => {
            const next = document.body.classList.contains("light-theme") ? "dark" : "light";
            try { localStorage.setItem(key, next); } catch (error) {}
            applyTheme(next);
          });
        });
        const ribbon = document.querySelector(".gro-ribbon");
        if (ribbon) {
          let ribbonFrame = null;
          let ribbonReady = false;
          const ribbonState = { x: 0, y: 0, targetX: 0, targetY: 0 };
          const calculateRibbonTarget = () => {
            const scrollY = window.scrollY || 0;
            ribbonState.targetY = Math.sin(scrollY / 720) * 22;
            ribbonState.targetX = Math.cos(scrollY / 820) * 18;
          };
          const applyRibbonPosition = () => {
            ribbon.style.setProperty("--ribbon-y", `${ribbonState.y}px`);
            ribbon.style.setProperty("--ribbon-x", `${ribbonState.x}px`);
          };
          const renderRibbon = () => {
            if (!ribbonReady) {
              ribbonState.x = ribbonState.targetX;
              ribbonState.y = ribbonState.targetY;
              ribbonReady = true;
            } else {
              ribbonState.x += (ribbonState.targetX - ribbonState.x) * 0.075;
              ribbonState.y += (ribbonState.targetY - ribbonState.y) * 0.075;
            }
            applyRibbonPosition();
            const dx = Math.abs(ribbonState.targetX - ribbonState.x);
            const dy = Math.abs(ribbonState.targetY - ribbonState.y);
            if (dx > 0.18 || dy > 0.18) {
              ribbonFrame = window.requestAnimationFrame(renderRibbon);
            } else {
              ribbonState.x = ribbonState.targetX;
              ribbonState.y = ribbonState.targetY;
              applyRibbonPosition();
              ribbonFrame = null;
            }
          };
          const requestRibbonMove = () => {
            calculateRibbonTarget();
            if (ribbonFrame !== null) return;
            ribbonFrame = window.requestAnimationFrame(renderRibbon);
          };
          requestRibbonMove();
          window.addEventListener("scroll", requestRibbonMove, { passive: true });
        }
      });
    })();

    const API_ROOT = "https://www.cbr-xml-daily.ru/archive";
    const DEFAULT_CODES = ["USD", "EUR", "CNY", "KZT"];
    const EXTRA_CODES = ["AED", "TRY", "GBP", "JPY", "CHF", "BYN", "AMD", "UZS"];
    const CURRENCY_NAMES = {
      RUB: "俄罗斯卢布",
      USD: "美元",
      EUR: "欧元",
      CNY: "人民币",
      KZT: "哈萨克斯坦坚戈",
      AED: "阿联酋迪拉姆",
      TRY: "土耳其里拉",
      GBP: "英镑",
      JPY: "日元",
      CHF: "瑞士法郎",
      BYN: "白俄罗斯卢布",
      AMD: "亚美尼亚德拉姆",
      UZS: "乌兹别克斯坦苏姆"
    };
    const RUB = {
      CharCode: "RUB",
      Nominal: 1,
      Name: "俄罗斯卢布",
      Value: 1,
      Previous: 1
    };
    const FALLBACK_DATA = {
      Date: "2026-08-01T11:30:00+03:00",
      Valute: {
        USD: { CharCode: "USD", Nominal: 1, Name: CURRENCY_NAMES.USD, Value: 79.4637 },
        EUR: { CharCode: "EUR", Nominal: 1, Name: CURRENCY_NAMES.EUR, Value: 91.1925 },
        CNY: { CharCode: "CNY", Nominal: 1, Name: CURRENCY_NAMES.CNY, Value: 11.7694 },
        KZT: { CharCode: "KZT", Nominal: 100, Name: CURRENCY_NAMES.KZT, Value: 16.7422 },
        AED: { CharCode: "AED", Nominal: 1, Name: CURRENCY_NAMES.AED, Value: 21.6375 },
        TRY: { CharCode: "TRY", Nominal: 10, Name: CURRENCY_NAMES.TRY, Value: 16.7751 },
        GBP: { CharCode: "GBP", Nominal: 1, Name: CURRENCY_NAMES.GBP, Value: 106.68 },
        JPY: { CharCode: "JPY", Nominal: 100, Name: CURRENCY_NAMES.JPY, Value: 49.4669 },
        CHF: { CharCode: "CHF", Nominal: 1, Name: CURRENCY_NAMES.CHF, Value: 98.5413 },
        BYN: { CharCode: "BYN", Nominal: 1, Name: CURRENCY_NAMES.BYN, Value: 27.3466 },
        AMD: { CharCode: "AMD", Nominal: 100, Name: CURRENCY_NAMES.AMD, Value: 21.6995 },
        UZS: { CharCode: "UZS", Nominal: 10000, Name: CURRENCY_NAMES.UZS, Value: 66.4402 }
      }
    };

    const state = {
      selected: new Set(DEFAULT_CODES),
      actualDate: null,
      requestedDate: null,
      allRates: { RUB }
    };

    const els = {
      app: document.getElementById("app"),
      date: document.getElementById("date-input"),
      chips: document.getElementById("currency-chips"),
      rates: document.getElementById("rates-grid"),
      quick: document.getElementById("quick-row"),
      status: document.getElementById("status"),
      amount: document.getElementById("amount"),
      from: document.getElementById("from-currency"),
      to: document.getElementById("to-currency"),
      result: document.getElementById("result-value"),
      resultNote: document.getElementById("result-note"),
      swap: document.getElementById("swap"),
      message: document.getElementById("message")
    };

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function toInputDate(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function toArchiveUrl(inputDate) {
      const [year, month, day] = inputDate.split("-");
      return `${API_ROOT}/${year}/${month}/${day}/daily_json.js`;
    }

    function humanDate(inputDate) {
      const [year, month, day] = inputDate.split("-");
      return `${day}.${month}.${year}`;
    }

    function dateFromIso(value) {
      return value.slice(0, 10);
    }

    function formatNumber(value, digits = 4) {
      return new Intl.NumberFormat("ru-RU", {
        maximumFractionDigits: digits,
        minimumFractionDigits: value < 100 ? Math.min(2, digits) : 2
      }).format(value);
    }

    function formatMoney(value, code) {
      const digits = code === "RUB" ? 2 : 4;
      return `${formatNumber(value, digits)} ${code}`;
    }

    function ratePerUnit(rate) {
      return Number(rate.Value) / Number(rate.Nominal);
    }

    function currencyName(code, rate) {
      return CURRENCY_NAMES[code] || rate.Name || code;
    }

    async function fetchWithFallback(inputDate) {
      const cursor = new Date(`${inputDate}T12:00:00`);

      for (let attempt = 0; attempt < 14; attempt += 1) {
        const candidate = toInputDate(cursor);
        const response = await fetch(toArchiveUrl(candidate), { cache: "no-store" });

        if (response.ok) {
          const data = await response.json();
          return {
            data,
            requested: inputDate,
            actual: dateFromIso(data.Date || candidate)
          };
        }

        cursor.setDate(cursor.getDate() - 1);
      }

      throw new Error("无法加载汇率。请尝试选择其他日期。");
    }

    function setLoading(isLoading) {
      els.app.classList.toggle("loading", isLoading);
      els.status.textContent = isLoading ? "正在更新汇率..." : "";
    }

    function showMessage(text) {
      els.message.textContent = text || "";
      els.message.classList.toggle("show", Boolean(text));
    }

    function renderChips() {
      const codes = Array.from(new Set([...DEFAULT_CODES, ...EXTRA_CODES, ...Object.keys(state.allRates).filter(code => code !== "RUB")]));
      els.chips.innerHTML = codes.map(code => {
        const checked = state.selected.has(code) ? "checked" : "";
        return `<label class="chip"><input type="checkbox" value="${code}" ${checked}>${code}</label>`;
      }).join("");

      els.chips.querySelectorAll("input").forEach(input => {
        input.addEventListener("change", () => {
          if (input.checked) {
            state.selected.add(input.value);
          } else {
            state.selected.delete(input.value);
          }
          renderRates();
          renderQuickRates();
          renderConverterOptions();
          calculate();
        });
      });
    }

    function renderQuickRates() {
      const codes = DEFAULT_CODES.filter(code => state.allRates[code]);
      els.quick.innerHTML = codes.map(code => {
        const rate = state.allRates[code];
        return `<div class="quick-rate"><b>${code}</b><span>${formatNumber(ratePerUnit(rate), 4)} ₽</span></div>`;
      }).join("");
    }

    function renderRates() {
      const codes = Array.from(state.selected).filter(code => state.allRates[code]);

      if (!codes.length) {
        els.rates.innerHTML = `<article class="rate"><div class="code">请选择货币</div><div class="note">请在上方勾选需要显示的货币。</div></article>`;
        return;
      }

      els.rates.innerHTML = codes.map(code => {
        const rate = state.allRates[code];
        const value = ratePerUnit(rate);
        const note = Number(rate.Nominal) === 1 ? "每 1 单位" : `${formatNumber(Number(rate.Value), 4)} ₽ / ${rate.Nominal}`;
        return `
          <article class="rate">
            <div class="rate-top">
              <span class="code">${code}</span>
              <span class="name">${currencyName(code, rate)}</span>
            </div>
            <div class="value">${formatNumber(value, 6)} ₽</div>
            <div class="note">${note}</div>
          </article>
        `;
      }).join("");
    }

    function renderConverterOptions() {
      const previousFrom = els.from.value || "KZT";
      const previousTo = els.to.value || "RUB";
      const codes = ["RUB", ...Array.from(new Set([...Array.from(state.selected), ...DEFAULT_CODES, ...EXTRA_CODES]))]
        .filter(code => state.allRates[code]);

      const options = codes.map(code => {
        const rate = state.allRates[code];
        return `<option value="${code}">${code} - ${currencyName(code, rate)}</option>`;
      }).join("");

      els.from.innerHTML = options;
      els.to.innerHTML = options;
      els.from.value = codes.includes(previousFrom) ? previousFrom : (codes.includes("KZT") ? "KZT" : codes[0]);
      els.to.value = codes.includes(previousTo) ? previousTo : "RUB";
    }

    function calculate() {
      const amount = Number(String(els.amount.value).replace(",", "."));
      const from = els.from.value;
      const to = els.to.value;

      if (!Number.isFinite(amount) || amount < 0) {
        els.result.textContent = "请输入金额";
        els.resultNote.textContent = "金额应为正数。";
        return;
      }

      const fromRate = state.allRates[from];
      const toRate = state.allRates[to];

      if (!fromRate || !toRate) {
        els.result.textContent = "...";
        els.resultNote.textContent = "请选择用于换算的货币。";
        return;
      }

      const rubAmount = amount * ratePerUnit(fromRate);
      const converted = rubAmount / ratePerUnit(toRate);
      els.result.textContent = formatMoney(converted, to);
      els.resultNote.textContent = `${formatMoney(amount, from)}，按 ${humanDate(state.actualDate)} 的汇率计算。`;
    }

    function updateStatus() {
      const requested = humanDate(state.requestedDate);
      const actual = humanDate(state.actualDate);
      els.status.textContent = requested === actual ? `汇率日期：${actual}` : `汇率日期：${actual}`;

      if (state.requestedDate !== state.actualDate) {
        showMessage(`所选日期未公布汇率，已使用最近一个已公布汇率日期：${actual}。`);
      }
    }

    async function loadRates() {
      setLoading(true);
      showMessage("");

      try {
        const result = await fetchWithFallback(els.date.value);
        state.requestedDate = result.requested;
        state.actualDate = result.actual;
        state.allRates = { RUB, ...result.data.Valute };

        renderChips();
        renderRates();
        renderQuickRates();
        renderConverterOptions();
        calculate();
        updateStatus();
      } catch (error) {
        state.requestedDate = els.date.value;
        state.actualDate = dateFromIso(FALLBACK_DATA.Date);
        state.allRates = { RUB, ...FALLBACK_DATA.Valute };

        renderChips();
        renderRates();
        renderQuickRates();
        renderConverterOptions();
        calculate();
        els.status.textContent = `汇率日期：${humanDate(state.actualDate)}`;
        showMessage("当前显示最近可用汇率。请稍后刷新页面。");
      } finally {
        setLoading(false);
      }
    }

    function init() {
      els.date.value = toInputDate(new Date());
      renderChips();

      els.date.addEventListener("change", loadRates);
      els.amount.addEventListener("input", calculate);
      els.from.addEventListener("change", calculate);
      els.to.addEventListener("change", calculate);
      els.swap.addEventListener("click", () => {
        const from = els.from.value;
        els.from.value = els.to.value;
        els.to.value = from;
        calculate();
      });

      loadRates();
    }

    init();
  </script>
</body>
</html>
